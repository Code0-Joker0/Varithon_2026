<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>वारकरी सेवा पोर्टल | Varkari Palkhi Assistance & Emergency Portal</title>
    <meta name="description" content="आळंदी व देहू ते पंढरपूर पालखी सोहळ्यासाठी हवामान इशारे, आणीबाणी संपर्क, आरोग्य केंद्र व पोलीस ठाणे पत्ते आणि बिन-औषधी प्रथमोपचार मार्गदर्शक." />
    <!-- Google Fonts for Marathi & Modern UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Translate widget -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'mr',
            includedLanguages: 'mr,hi,en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <style>
      /* ── Force Google Translate widget to match dark navbar ── */
      #google_translate_element .goog-te-gadget-simple {
        background: #18181b !important;  /* zinc-900 */
        border: 2px solid #f97316 !important; /* orange-500 */
        border-radius: 12px !important;
        padding: 4px 10px !important;
        font-family: 'Mukta', 'Outfit', sans-serif !important;
        font-weight: 700 !important;
        font-size: 14px !important;
      }
      #google_translate_element .goog-te-menu-value span,
      #google_translate_element .goog-te-gadget-simple a span {
        color: #ffffff !important;
      }
      #google_translate_element .goog-te-gadget-simple .goog-te-menu-value img {
        display: none !important;
      }
      /* Hide the "Powered by Google" footer bar that appears top of page */
      .goog-te-banner-frame, .skiptranslate { display: none !important; }
      body { top: 0 !important; }  /* prevent page push-down from the banner */
    </style>
  </head>
  <body class="bg-amber-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
